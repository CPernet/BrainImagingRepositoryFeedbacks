<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brain Imaging Repository Feedback</title>
    <style>
      body {
        background: #f6f8fb;
        color: #1f2937;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 2rem;
      }

      main {
        margin: 0 auto;
        max-width: 800px;
      }

      .panel {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        margin-top: 1.5rem;
        padding: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brain Imaging Repository Feedback</h1>
      <p>
        This example page hosts the embeddable feedback widget. In production,
        copy the <code>widget.js</code> file into any data repository page and
        point it at the feedback API.
      </p>

      <section class="panel">
        <div data-feedback-widget data-endpoint="/api/feedback"></div>
      </section>
    </main>

    <script src="./widget.js"></script>
  </body>
</html>
